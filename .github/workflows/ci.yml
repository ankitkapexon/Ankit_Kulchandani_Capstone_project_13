name: Mobile Test Generator CI/CD

on:
  push:
    branches: [ main, develop, Aditya, Ankit_Kulchandani ]
  pull_request:
    branches: [ main, develop, Aditya, Ankit_Kulchandani ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run Black (code formatting check)
        run: black --check .
        continue-on-error: true
      
      - name: Run isort (import sorting check)
        run: isort --check-only .
        continue-on-error: true
      
      - name: Run Flake8 (linting)
        run: flake8 . --count --max-line-length=120 --statistics
        continue-on-error: true

  # Job 2: Unit & Integration Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist
      
      - name: Create test environment file
        run: |
          cat > .env << EOF
          VISION_AGENT_PROVIDER=mock
          TESTCASE_AGENT_PROVIDER=mock
          OPENAI_API_KEY=mock_key_for_testing
          SELF_HEALING_ENABLED=false
          EOF
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Archive test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            htmlcov/
            coverage.xml

  # Job 3: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
      
      - name: Run Safety (dependency vulnerability check)
        run: safety check --json
        continue-on-error: true
      
      - name: Run Bandit (security linter)
        run: bandit -r agents/ services/ utils/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # Job 4: Integration Test (Mock Pipeline)
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create mock environment
        run: |
          cat > .env << EOF
          VISION_AGENT_PROVIDER=mock
          TESTCASE_AGENT_PROVIDER=mock
          OPENAI_API_KEY=mock_key_for_ci
          SELF_HEALING_ENABLED=true
          HEALING_MAX_RETRIES=2
          EOF
      
      - name: Create test screenshots directory
        run: mkdir -p artifacts/input_screenshots
      
      - name: Run SSM generator (mock mode)
        run: |
          python pipelines/ssm_generator.py artifacts/input_screenshots
        continue-on-error: true
      
      - name: Verify artifacts structure
        run: |
          ls -la artifacts/
          echo "Checking for artifact directories..."
          [ -d "artifacts/ssm_json_output" ] && echo "G�� SSM output dir exists"
          [ -d "artifacts/locator_output" ] && echo "G�� Locator output dir exists"
          [ -d "artifacts/generated_appium_scripts" ] && echo "G�� Scripts dir exists"

  screenshot-flow-smoke:
    name: Screenshot Flow Smoke
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run screenshot flow smoke test
        run: |
          pytest tests/test_live_demo_flow_smoke_contract.py -k screenshot -v

  realtime-flow-smoke:
    name: Realtime Flow Smoke
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run realtime flow smoke test
        run: |
          pytest tests/test_live_demo_flow_smoke_contract.py -k realtime -v

  # Job 5: Appium E2E Tests (Android)
  appium-tests:
    name: Run Appium E2E Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            device: Pixel_6_API_34
            platformVersion: '14.0'
            appPath: demo_mobile_apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
            appiumDriver: uiautomator2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html pytest-rerunfailures appium-python-client
      
      - name: Set up Node.js (for Appium)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      
      - name: Install Appium
        run: |
          # Install Appium stable version (not @next to avoid peer dependency issues)
          npm install -g appium
          
          # Verify Appium installation
          appium --version
          
          # Install platform-specific driver
          echo "Installing ${{ matrix.appiumDriver }} driver..."
          appium driver install ${{ matrix.appiumDriver }} || true
          
          # Verify driver installation
          echo "Installed drivers:"
          appium driver list --installed --verbose
          echo "G�� Appium driver setup step completed"
      
      # Android-specific setup
      - name: Enable KVM (Android)
        if: matrix.platform == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Set up Android SDK (Android)
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3
      
      - name: Download SauceLabs Demo App (Android)
        if: matrix.platform == 'Android'
        run: |
          mkdir -p demo_mobile_apps
          curl -L -o ${{ matrix.appPath }} \
            https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
      
      - name: Create Android Emulator (Android)
        if: matrix.platform == 'Android'
        run: |
          echo "y" | sdkmanager "platform-tools" "platforms;android-34" "emulator" "system-images;android-34;google_apis;x86_64"
          
          # Create AVD without device profile (let it use defaults)
          echo "no" | avdmanager create avd \
            -n ${{ matrix.device }} \
            -k "system-images;android-34;google_apis;x86_64" \
            --force
          
          # Verify AVD was created
          echo "Listing available AVDs:"
          avdmanager list avd
          
          # Find AVD config location (can be in .config or directly in home)
          if [ -f "$HOME/.config/.android/avd/${{ matrix.device }}.avd/config.ini" ]; then
            AVD_CONFIG="$HOME/.config/.android/avd/${{ matrix.device }}.avd/config.ini"
          elif [ -f "$HOME/.android/avd/${{ matrix.device }}.avd/config.ini" ]; then
            AVD_CONFIG="$HOME/.android/avd/${{ matrix.device }}.avd/config.ini"
          else
            echo "ERROR: AVD config not found"
            echo "Checking possible locations:"
            ls -la "$HOME/.config/.android/avd/" 2>/dev/null || echo "Not in .config"
            ls -la "$HOME/.android/avd/" 2>/dev/null || echo "Not in home"
            exit 1
          fi
          
          echo "Found AVD config at: $AVD_CONFIG"
          echo "Configuring AVD..."
          echo "hw.keyboard=yes" >> "$AVD_CONFIG"
          echo "hw.gpu.enabled=yes" >> "$AVD_CONFIG"
          echo "hw.gpu.mode=swiftshader_indirect" >> "$AVD_CONFIG"
          echo "disk.dataPartition.size=4096M" >> "$AVD_CONFIG"
          echo "G�� AVD configured successfully"
      
      - name: Start Android Emulator (Android)
        if: matrix.platform == 'Android'
        timeout-minutes: 10
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        run: |
          # Set AVD home to where it was actually created
          export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          
          echo "AVD Home: $ANDROID_AVD_HOME"
          echo "Listing AVDs:"
          $ANDROID_HOME/emulator/emulator -list-avds
          
          # Start emulator
          $ANDROID_HOME/emulator/emulator -avd ${{ matrix.device }} -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          
          # Wait for emulator to be ready
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          
          # Verify emulator is running
          adb devices

          # Improve test stability on fresh emulator boots
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME || true

          echo "Waiting for package manager and launcher to settle..."
          sleep 10
          echo "G�� Emulator started successfully"
      
      # iOS-specific setup
      - name: Download SauceLabs Demo App (iOS)
        if: matrix.platform == 'iOS'
        run: |
          mkdir -p demo_mobile_apps
          # Download iOS simulator build (comes as a zip)
          curl -L -o demo_mobile_apps/ios_app.zip \
            https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.zip
          
          # Unzip the .app bundle
          cd demo_mobile_apps
          unzip -o ios_app.zip
          
          # Rename to expected name
          APP_BUNDLE=$(find . -name "*.app" -type d -maxdepth 1 | head -n 1)
          if [ -n "$APP_BUNDLE" ]; then
            mv "$APP_BUNDLE" "SauceLabs-Demo-App.Simulator.app"
            echo "Renamed $APP_BUNDLE to SauceLabs-Demo-App.Simulator.app"
          fi
          
          # List contents to verify
          ls -la
          cd ..
      
      - name: Set up iOS Simulator (iOS)
        if: matrix.platform == 'iOS'
        timeout-minutes: 10
        run: |
          echo "Listing available simulators..."
          xcrun simctl list devices available
          
          # Find and boot simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 '${{ matrix.device }}' | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Device ID: $DEVICE_ID"
          
          # Boot simulator
          xcrun simctl boot $DEVICE_ID || echo "Simulator may already be booted"
          
          # Wait for simulator to fully boot (check for "Booted" status)
          echo "Waiting for simulator to boot..."
          for i in {1..60}; do
            STATUS=$(xcrun simctl list devices | grep "$DEVICE_ID" | grep -o "Booted" || echo "")
            if [ "$STATUS" = "Booted" ]; then
              echo "G�� Simulator booted successfully"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          # Give simulator extra time to fully initialize
          echo "Allowing simulator to fully initialize..."
          sleep 15
          
          # Verify simulator is ready
          xcrun simctl list devices | grep "$DEVICE_ID"
      
      - name: Install SauceLabs Demo App (iOS)
        if: matrix.platform == 'iOS'
        run: |
          # Find booted device ID
          echo "Looking for booted simulators..."
          xcrun simctl list devices | grep Booted
          
          DEVICE_ID=$(xcrun simctl list devices | grep -E 'iPhone.*Booted' | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          
          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No booted simulator found"
            echo "All devices:"
            xcrun simctl list devices
            exit 1
          fi
          
          echo "Installing app on device: $DEVICE_ID"
          
          # Install app
          if xcrun simctl install "$DEVICE_ID" "${{ matrix.appPath }}"; then
            echo "G�� App installed successfully"
          else
            echo "ERROR: Failed to install app"
            echo "Checking if app exists:"
            ls -la ${{ matrix.appPath }}
            exit 1
          fi
          
          # Verify installation
          echo "Installed apps:"
          xcrun simctl listapps "$DEVICE_ID" | grep -i sauce || echo "App may not be listed yet"
      
      # Common Appium setup
      - name: Start Appium Server
        run: |
          # Start Appium in background
          appium --log-level info > appium.log 2>&1 &
          APPIUM_PID=$!
          echo $APPIUM_PID > appium.pid
          echo "Appium server PID: $APPIUM_PID"
          
          # Wait for Appium to be ready (check port 4723)
          echo "Waiting for Appium server to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
              echo "G�� Appium server is ready!"
              curl -s http://127.0.0.1:4723/status | head -c 200
              echo ""
              break
            fi
            if ! ps -p $APPIUM_PID > /dev/null 2>&1; then
              echo "ERROR: Appium server process died!"
              echo "Last 50 lines of appium.log:"
              tail -50 appium.log
              exit 1
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          
          # Final verification
          if ! curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
            echo "ERROR: Appium server failed to start after 60 seconds"
            echo "Appium log:"
            cat appium.log
            exit 1
          fi
      
      - name: Configure test environment
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          cat > .env << EOF
          APPIUM_SERVER_URL=http://127.0.0.1:4723
          PLATFORM_NAME=${{ matrix.platform }}
          PLATFORM_VERSION=${{ matrix.platformVersion }}
          DEVICE_NAME=${{ matrix.device }}
          APP_PATH=$(pwd)/${{ matrix.appPath }}
          SELF_HEALING_ENABLED=true
          HEALING_MAX_RETRIES=3
          OPENAI_API_KEY=${LITELLM_API_KEY:-mock_key}
          OPENAI_API_BASE=http://107.22.98.31:10501/v1
          OPENAI_MODEL=Azure#gpt-5.4
          EOF
      
      # Run tests
      - name: Run Login Test
        env:
          APPIUM_SERVER_URL: http://127.0.0.1:4723
          PLATFORM_NAME: ${{ matrix.platform }}
          PLATFORM_VERSION: ${{ matrix.platformVersion }}
          DEVICE_NAME: ${{ matrix.device }}
          APP_PATH: ${{ github.workspace }}/${{ matrix.appPath }}
          SELF_HEALING_ENABLED: "true"
          HEALING_MAX_RETRIES: "3"
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI_API_BASE: http://107.22.98.31:10501/v1
          OPENAI_MODEL: Azure#gpt-5.4
        run: |
          echo "Starting login test for ${{ matrix.platform }}..."
          set +e  # Don't exit immediately on error, we want to capture exit code

          REPORT_DIR="artifacts/test_execution_reports/${{ matrix.platform }}_${{ github.run_id }}_${{ github.run_attempt }}"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REPORT_DIR"
          
          pytest tests/e2e/test_login_screen.py \
            -v \
            --reruns 1 \
            --reruns-delay 5 \
            --html="$REPORT_DIR/test_report_login_${{ matrix.platform }}.html" \
            --self-contained-html \
            --junitxml="$REPORT_DIR/junit_login_${{ matrix.platform }}.xml" \
            --tb=short
          
          TEST_EXIT_CODE=$?

          echo "Collecting test artifacts in $REPORT_DIR"
          [ -f appium.log ] && cp appium.log "$REPORT_DIR/appium.log" || true
          [ -d screenshots ] && cp -r screenshots "$REPORT_DIR/screenshots" || true
          find . -maxdepth 1 -type f -name "*.png" -exec cp {} "$REPORT_DIR/" \; || true
          
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "G�� Login test PASSED"
          else
            echo "G�� Login test FAILED (exit code: $TEST_EXIT_CODE)"
            echo "Appium server log (last 100 lines):"
            tail -100 appium.log || true
            tail -100 appium.log > "$REPORT_DIR/appium_tail.log" || true
          fi
          
          # Exit with test's exit code (this will fail the job if tests failed)
          exit $TEST_EXIT_CODE

      - name: Build consolidated HTML report index
        if: always()
        run: |
          REPORT_DIR="${REPORT_DIR:-artifacts/test_execution_reports/${{ matrix.platform }}_${{ github.run_id }}_${{ github.run_attempt }}}"
          mkdir -p "$REPORT_DIR"

          LOGIN_REPORT="$(ls -1 "$REPORT_DIR"/test_report_login_${{ matrix.platform }}.html 2>/dev/null | head -n 1 || true)"
          JUNIT_REPORT="$(ls -1 "$REPORT_DIR"/junit_login_${{ matrix.platform }}.xml 2>/dev/null | head -n 1 || true)"

          cat > "$REPORT_DIR/report.html" << EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>CI Test Report Index - ${{ matrix.platform }}</title>
            <style>
              body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; background: #f7f9fb; color: #1f2937; }
              .card { max-width: 980px; background: #fff; border: 1px solid #d8e1eb; border-radius: 12px; padding: 18px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
              h1 { margin: 0 0 8px 0; font-size: 1.4rem; }
              .meta { color: #475569; margin: 4px 0 16px 0; }
              ul { margin: 0; padding-left: 20px; }
              li { margin: 8px 0; }
              a { color: #0f4c81; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .badge { display: inline-block; border-radius: 999px; background: #e2e8f0; padding: 4px 10px; font-size: 0.8rem; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Android CI Test Reports</h1>
              <p class="meta">Run ID: ${{ github.run_id }} | Attempt: ${{ github.run_attempt }} | Platform: ${{ matrix.platform }}</p>
              <p><span class="badge">Artifacts Summary</span></p>
              <ul>
                <li><a href="test_report_login_${{ matrix.platform }}.html" target="_blank" rel="noopener">Pytest HTML Report (Login)</a></li>
                <li><a href="junit_login_${{ matrix.platform }}.xml" target="_blank" rel="noopener">JUnit XML Report (Login)</a></li>
                <li><a href="appium.log" target="_blank" rel="noopener">Appium Full Log</a></li>
                <li><a href="appium_tail.log" target="_blank" rel="noopener">Appium Failure Tail (last 100 lines)</a></li>
              </ul>
              <p class="meta">If a link does not open, that file was not produced for this run.</p>
            </div>
          </body>
          </html>
          EOF

          echo "Generated consolidated report index at $REPORT_DIR/report.html"
      
      # Disabled - Run only login test for now
      # - name: Run Cart Test
      #   run: |
      #     pytest artifacts/generated_appium_scripts/test_cart_screen.py \
      #       -v \
      #       --html=test_report_cart_${{ matrix.platform }}.html \
      #       --self-contained-html \
      #       --tb=short
      #   continue-on-error: true
      
      # - name: Run Product Details Test
      #   run: |
      #     pytest artifacts/generated_appium_scripts/test_product_details_screen.py \
      #       -v \
      #       --html=test_report_product_details_${{ matrix.platform }}.html \
      #       --self-contained-html \
      #       --tb=short
      #   continue-on-error: true
      
      # - name: Run Product Listing Test
      #   run: |
      #     pytest artifacts/generated_appium_scripts/test_product_listing_screen.py \
      #       -v \
      #       --html=test_report_product_listing_${{ matrix.platform }}.html \
      #       --self-contained-html \
      #       --tb=short
      #   continue-on-error: true
      
      - name: Stop Appium Server
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill $(cat appium.pid) || true
          fi
      
      - name: Upload test reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: appium-test-reports-${{ matrix.platform }}
          path: |
            artifacts/test_execution_reports/
          if-no-files-found: warn
      
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: failure-screenshots-${{ matrix.platform }}
          path: |
            screenshots/
            *.png
          if-no-files-found: warn

  # Job 6: Report Generation Portal
  report-generation:
    name: Report Generation
    runs-on: ubuntu-latest
    needs: [appium-tests]
    if: always()

    steps:
      - name: Download Android test reports artifact
        uses: actions/download-artifact@v5
        with:
          name: appium-test-reports-Android
          path: reports_input
        continue-on-error: true

      - name: Build reports portal HTML
        run: |
          mkdir -p reports_portal

          REPORT_FILE="$(find reports_input -type f -name 'report.html' | sort | tail -n 1 || true)"

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8" />'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1" />'
            echo '  <title>Mobile Test Generator Reports Portal</title>'
            echo '  <style>'
            echo '    body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; background: #f4f7fb; color: #1f2937; }'
            echo '    .card { max-width: 980px; background: #fff; border: 1px solid #d8e1eb; border-radius: 12px; padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }'
            echo '    h1 { margin: 0 0 8px 0; font-size: 1.5rem; }'
            echo '    .meta { color: #475569; margin: 4px 0 16px 0; }'
            echo '    .btn { display: inline-block; padding: 10px 16px; background: #0f4c81; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }'
            echo '    .btn:hover { background: #0c3b64; }'
            echo '    .links { margin-top: 18px; }'
            echo '    ul { padding-left: 20px; }'
            echo '    li { margin: 8px 0; }'
            echo '    a.file-link { color: #0f4c81; text-decoration: none; }'
            echo '    a.file-link:hover { text-decoration: underline; }'
            echo '    .warn { color: #92400e; background: #fff7ed; border-left: 4px solid #f59e0b; padding: 10px; border-radius: 6px; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <div class="card">'
            echo '    <h1>Reports Section</h1>'
            echo "    <p class=\"meta\">Run ID: ${{ github.run_id }} | Attempt: ${{ github.run_attempt }} | Branch: ${{ github.ref_name }}</p>"

            if [ -n "$REPORT_FILE" ]; then
              REPORT_REL="${REPORT_FILE#reports_input/}"
              echo "    <p><a class=\"btn\" href=\"../reports_input/$REPORT_REL\" target=\"_blank\" rel=\"noopener\">View Reports</a></p>"
            else
              echo '    <p class="warn">No consolidated report.html file was found in this run artifacts.</p>'
            fi

            echo '    <div class="links">'
            echo '      <h2>All Report Files</h2>'
            echo '      <ul>'
            while IFS= read -r file; do
              rel="${file#reports_input/}"
              safe_rel="${rel//&/&amp;}"
              safe_rel="${safe_rel//</&lt;}"
              safe_rel="${safe_rel//>/&gt;}"
              echo "        <li><a class=\"file-link\" href=\"../reports_input/$safe_rel\" target=\"_blank\" rel=\"noopener\">$safe_rel</a></li>"
            done < <(find reports_input -type f \( -name '*.html' -o -name '*.xml' -o -name '*.log' -o -name '*.png' \) | sort)
            echo '      </ul>'
            echo '    </div>'
            echo '  </div>'
            echo '</body>'
            echo '</html>'
          } > reports_portal/index.html

      - name: Upload reports section artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports-section
          path: |
            reports_portal/index.html
            reports_input/
          if-no-files-found: warn

  # Job 7: Build & Package
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
      
      - name: Create package structure
        run: |
          echo "Creating distributable package..."
          mkdir -p dist
          tar -czf dist/mobile-test-generator-${GITHUB_SHA::7}.tar.gz \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='artifacts/test_execution_reports' \
            .
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: package
          path: dist/*.tar.gz
          retention-days: 30

  # Job 8: LiteLLM Gateway Test (Optional - runs if secrets configured)
  litellm-gateway-test:
    name: LiteLLM Gateway Connection Test
    runs-on: ubuntu-latest
    needs: []
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check LiteLLM API key availability
        id: litellm_key_check
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ -n "$LITELLM_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "LiteLLM API key detected. Running gateway connection checks."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "LITELLM_API_KEY is not configured. Gateway connection checks will be skipped."
          fi
      
      - name: Create LiteLLM environment
        if: steps.litellm_key_check.outputs.has_key == 'true'
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          cat > .env << EOF
          VISION_AGENT_PROVIDER=openai
          TESTCASE_AGENT_PROVIDER=openai
          OPENAI_API_KEY=$LITELLM_API_KEY
          OPENAI_MODEL=Azure#gpt-5.4
          OPENAI_API_BASE=http://107.22.98.31:10501/v1
          SELF_HEALING_ENABLED=true
          EOF

      - name: Create fallback mock environment
        if: steps.litellm_key_check.outputs.has_key != 'true'
        run: |
          cat > .env << EOF
          VISION_AGENT_PROVIDER=mock
          TESTCASE_AGENT_PROVIDER=mock
          OPENAI_API_KEY=mock_key_for_ci
          SELF_HEALING_ENABLED=true
          EOF
      
      - name: Test LiteLLM Gateway Connection
        if: steps.litellm_key_check.outputs.has_key == 'true'
        run: |
          python utils/custom_gateway.py

      - name: Skip LiteLLM Gateway Connection (missing key)
        if: steps.litellm_key_check.outputs.has_key != 'true'
        run: |
          echo "Skipping LiteLLM gateway connection test because LITELLM_API_KEY is not set."
      
      - name: Test LangChain Integration
        env:
          HAS_LITELLM_KEY: ${{ steps.litellm_key_check.outputs.has_key }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ "$HAS_LITELLM_KEY" = "true" ]; then
            export OPENAI_API_KEY="$LITELLM_API_KEY"
            export OPENAI_MODEL="Azure#gpt-5.4"
            export OPENAI_API_BASE="http://107.22.98.31:10501/v1"
            export VISION_AGENT_PROVIDER=openai
            export TESTCASE_AGENT_PROVIDER=openai
            echo "Running LangChain integration in gateway mode."
          else
            export OPENAI_API_KEY="mock_key_for_ci"
            export VISION_AGENT_PROVIDER=mock
            export TESTCASE_AGENT_PROVIDER=mock
            unset OPENAI_API_BASE
            unset OPENAI_MODEL
            echo "Running LangChain integration in mock mode (no LiteLLM key)."
          fi

          python - <<'PY'
          import traceback

          try:
              from agents.langchain_vision_agent import LangChainVisionAgent

              agent = LangChainVisionAgent()
              print("LangChain agent initialized successfully")
          except Exception:
              print("LangChain integration smoke test failed.")
              traceback.print_exc()
              raise
          PY

  # Job 9: Cost Tracking Report
  cost-analysis:
    name: LLM Cost Analysis
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Generate cost report
        run: |
          echo "# LLM Token Usage Report" > cost-report.md
          echo "" >> cost-report.md
          echo "**Build:** ${GITHUB_SHA::7}" >> cost-report.md
          echo "**Date:** $(date)" >> cost-report.md
          echo "" >> cost-report.md
          echo "Token usage tracking would be implemented here." >> cost-report.md
          echo "This requires actual LLM calls during integration tests." >> cost-report.md
      
      - name: Upload cost report
        uses: actions/upload-artifact@v5
        with:
          name: cost-report
          path: cost-report.md
